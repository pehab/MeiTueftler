name: Android CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.name }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Keep debug signing key for installable updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: meitueftler-debug-signing-v1
      - name: Read app version
        id: version
        run: echo "name=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - name: Test, lint and build
        run: bash gradlew testDebugUnitTest lintDebug assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: MeiTueftler-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html

  release:
    needs: [ build, smoke ]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      APP_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download tested APK
        run: gh run download "$GITHUB_RUN_ID" --repo "$GH_REPO" --name MeiTueftler-debug --dir apk
      - name: Publish playable test release
        run: |
          RELEASE_TAG="v${APP_VERSION}-build.${GITHUB_RUN_NUMBER}"
          RELEASE_APK="MeiTueftler-${APP_VERSION}-build.${GITHUB_RUN_NUMBER}.apk"
          mv apk/app-debug.apk "apk/$RELEASE_APK"
          cat > release-notes.txt <<'NOTES'
          Spielbare Android-Testversion der Murmel- und Rampenwerkstatt.

          Die APK unten direkt auf dem Android-Gerät herunterladen und installieren.
          Enthält zehn Rätsel, einen freien Bauplatz und lokal gespeicherten Fortschritt.
          Dies ist ein Debug-Testbuild; kein Play-Store-Release.
          NOTES
          gh release create "$RELEASE_TAG" "apk/$RELEASE_APK" --repo "$GH_REPO" --target "$GITHUB_SHA" --title "MeiTüftler ${APP_VERSION} · Testbuild ${GITHUB_RUN_NUMBER}" --notes-file release-notes.txt --prerelease

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download tested APK
        run: gh run download "$GITHUB_RUN_ID" --repo "$GH_REPO" --name MeiTueftler-debug --dir apk
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Launch on tablet-sized Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          script: |
            mkdir -p screenshots
            adb shell wm size 1280x800
            adb shell wm density 160
            adb install -r apk/app-debug.apk
            adb shell am start -W -n de.haberland.meitueftler/.MainActivity
            sleep 2
            adb shell pidof de.haberland.meitueftler
            adb exec-out screencap -p > screenshots/menu.png
            adb shell input tap 350 710
            sleep 1
            adb exec-out screencap -p > screenshots/levels.png
            adb shell input tap 350 165
            sleep 1
            adb exec-out screencap -p > screenshots/workshop.png
            adb shell pidof de.haberland.meitueftler
            adb logcat -d -b crash > screenshots/crash.log
            if rg -q 'FATAL EXCEPTION' screenshots/crash.log; then cat screenshots/crash.log; exit 1; fi
      - name: Upload interface screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: interface-screenshots
          path: screenshots/
