name: Android CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.name }}
    permissions:
      contents: read
    steps:
      - name: Set Git default branch
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node.js 24
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5, Node.js 24
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5, Node.js 24
      - name: Configure private test signing key
        env:
          TEST_KEYSTORE_BASE64: ${{ secrets.MEITUEFTLER_TEST_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$TEST_KEYSTORE_BASE64" ]; then
            umask 077
            printf '%s' "$TEST_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/meitueftler-test.keystore"
            echo "MEITUEFTLER_SIGNING_STORE=$RUNNER_TEMP/meitueftler-test.keystore" >> "$GITHUB_ENV"
            echo "Using the persistent private test signing key from Actions secrets."
          elif [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "::error::MEITUEFTLER_TEST_KEYSTORE_BASE64 is required for published main builds."
            exit 1
          else
            echo "::notice::No persistent test signing secret configured; this APK uses an ephemeral debug signature."
          fi
      - name: Configure optional Firebase app
        env:
          FIREBASE_CONFIG: ${{ secrets.MEITUEFTLER_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$FIREBASE_CONFIG" ]; then
            umask 077
            printf '%s' "$FIREBASE_CONFIG" > app/google-services.json
          else
            echo "Using the MeiTueftler Firebase client configuration from the repository."
          fi
      - name: Read app version
        id: version
        run: echo "name=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - name: Test, lint and build
        run: bash gradlew --warning-mode all testDebugUnitTest lintDebug lintRelease assembleDebug assembleRelease signingReport
      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7, Node.js 24
        with:
          name: MeiTueftler-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7, Node.js 24
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml


  release:
    needs: [ build, smoke ]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      APP_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download tested APK
        run: gh run download "$GITHUB_RUN_ID" --repo "$GH_REPO" --name MeiTueftler-debug --dir apk
      - name: Publish playable test release
        run: |
          RELEASE_TAG="v${APP_VERSION}-build.${GITHUB_RUN_NUMBER}"
          RELEASE_APK="MeiTueftler-${APP_VERSION}-build.${GITHUB_RUN_NUMBER}.apk"
          mv apk/app-debug.apk "apk/$RELEASE_APK"
          cat > release-notes.txt <<'NOTES'
          Spielbare Android-Testversion der Murmel- und Rampenwerkstatt.

          Die APK unten direkt auf dem Android-Gerät herunterladen und installieren.
          Enthält 24 Rätsel, davon 18 überarbeitete Hinderniswege mit Tunneln, S-Kurven und hohen Galerien, Bretter, Trampoline, Blöcke, Ventilatoren, Schalter und Türen, einen freien Bauplatz mit 20 Bauteilen, benannte Erfindungen und eine warme Holzwerkstatt. Crashlytics ist eingerichtet und wird nach Zustimmung im Elternbereich aktiviert. Neues MeiApp-Icon. Fortschritt und Maschinen werden lokal gespeichert.
          Dies ist ein Debug-Testbuild; kein Play-Store-Release.
          Diese APK verwendet den festen privaten Test-Signaturschlüssel. Künftige Testversionen lassen sich als Updates installieren.
          Beim Wechsel von älteren Builds mit zufälligen Signaturen ist einmalig eine Neuinstallation nötig, die lokalen Fortschritt löscht.
          NOTES
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "apk/$RELEASE_APK" --repo "$GH_REPO" --clobber
          else
            gh release create "$RELEASE_TAG" "apk/$RELEASE_APK" --repo "$GH_REPO" --target "$GITHUB_SHA" --title "MeiTüftler ${APP_VERSION} · Testbuild ${GITHUB_RUN_NUMBER}" --notes-file release-notes.txt --prerelease
          fi

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Set Git default branch
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node.js 24
      - name: Download tested APK
        run: gh run download "$GITHUB_RUN_ID" --repo "$GH_REPO" --name MeiTueftler-debug --dir apk
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Launch on tablet-sized Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2, Node.js 24
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 3072M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: python3 scripts/smoke_android.py
      - name: Upload interface screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7, Node.js 24
        with:
          name: interface-screenshots
          path: screenshots/
